server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/mydatabase
    username: myuser
    password: ${DB_PASSWORD:secret}
  docker:
    compose:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

aws:
  region: ap-southeast-2
  cloudfront:
    domain: d3i7r8z4cxs3p9.cloudfront.net
  s3:
    mock: false
    buckets:
      customer: fs-kaiday-customer-test


app:
  cors:
    allowed-origins: "*"
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000 # 1 hour
  google:
    places-key: ${GOOGLE_PLACES_KEY}
  translation:
    api-key: ${GOOGLE_TRANSLATE_API_KEY:}
    base-url: https://translation.googleapis.com/language/translate/v2
    timeout-ms: 5000
  yolo:
    endpoint: ${YOLO_ENDPOINT:http://localhost:5001/detect}
    confidence-threshold: 0.60
    timeout-ms: ${YOLO_TIMEOUT_MS:5000}
