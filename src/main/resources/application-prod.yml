spring:
  jpa:
    hibernate:
      # validate: checks schema matches entities on startup — fails fast if schema drifts.
      # Never use "update" in production; it silently alters tables and can destroy data.
      ddl-auto: validate
    show-sql: false
  sql:
    init:
      # "never": do not re-run data.sql on every boot.
      # data.sql is for development seeding only.
      mode: never

app:
  cors:
    # Comma-separated list of allowed frontend origins.
    # Set ALLOWED_ORIGINS in the production environment.
    # Example: https://kaiday.app,https://www.kaiday.app
    allowed-origins: ${ALLOWED_ORIGINS}
  starter-seed:
    enabled: ${STARTER_SEED_ENABLED:false}
