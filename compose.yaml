services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      # Persist data across restarts
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U myuser -d mydatabase" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot Backend ─────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mydatabase
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: secret
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_PLACES_KEY: ${GOOGLE_PLACES_KEY}
      VISION_API_URL: http://vision-service:8000
      VISION_TIMEOUT_MS: ${VISION_TIMEOUT_MS:-60000}
      VISION_SUPPORTED_LANGUAGES: ${VISION_SUPPORTED_LANGUAGES:-en,es,fr,ja}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      vision-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── YOLO Object Detection Service ──────────────────────────────────────────
  # Vision ML Service (replaces the old simple YOLO service)
  vision-service:
    build:
      context: ./ml-services/vision-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      ENABLE_CUDA: ${VISION_ENABLE_CUDA:-0}
      FORCE_CPU: ${VISION_FORCE_CPU:-0}
      YOLO_MODEL: ${VISION_YOLO_MODEL:-yolov8m.pt}
      SIGLIP_MODEL: ${VISION_SIGLIP_MODEL:-google/siglip-base-patch16-224}
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)\" || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Vite / React Frontend ───────────────────────────────────────────────────
  frontend:
    build:
      context: ../W19-front-end
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_PLACES_KEY: ${GOOGLE_PLACES_KEY}
        VITE_ENABLE_PWA: "false"
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
