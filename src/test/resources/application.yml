spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: "test-secret-for-integration-tests-only-do-not-use-in-prod"
    expiration-ms: 3600000 # 1 hour
  google:
    places-key: "test-api-key-not-used-in-tests"
  scanner:
    yolo-url: ""
    translation-url: ""
    default-confidence-threshold: 0.4
    default-max-results: 6
