server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/mydatabase
    username: myuser
    password: secret
  docker:
    compose:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

aws:
  region: ap-southeast-2
  s3:
    mock: false
    buckets:
      customer: fs-kaiday-customer-test


app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000 # 1 hour
  google:
    places-key: ${GOOGLE_PLACES_KEY}
